<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jo AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #ffd1eb;
        }

        .header {
            height: 65px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 25px;
            font-size: 21px;
            font-weight: bold;
        }

        .logo {
            margin-right: 10px;
        }

        .chat-container {
            width: 800px;
            max-width: 95%;
            height: calc(100vh - 105px);
            margin: 20px auto;
            background: white;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 25px;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
        }

        .user {
            justify-content: flex-end;
        }

        .bubble {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user .bubble {
            background: #e5e5e5;
        }

        .ai .bubble {
            background: #ffdef4;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        #message {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        button {
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    cursor: pointer;
    font-size: 15px;
    background: #f6a8da;
    color: white;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

button:active {
    transform: scale(0.95);
}
        .typing {
            font-style: italic;
            color: #777;
        }
    .dark-mode {
    background: #252424;
}

.dark-mode .header {
    background: #111111;
    color: white;
    border-bottom-color: #eebfdf;
}

.dark-mode .chat-container {
    background: #111111;
}

.dark-mode #chat {
    color: white;
}

.dark-mode .user .bubble {
    background: #b888a8;
    color: white;
}

.dark-mode .ai .bubble {
    background: #5a304b;
    color: white;
}

.dark-mode .input-area {
    border-top-color: #444;
}

.dark-mode #message {
    background: #3a3a3a;
    color: white;
    border-color: #555;
}

.dark-mode #message::placeholder {
    color: #bbb;
}
    </style>
</head>

<body>

    <div class="header">
    <div class="logo">🎀</div>
    <div style="flex: 1;">Aijoshyl</div>

    <button onclick="clearChat()" id="clearButton">
        🗑️
    </button>

    <button onclick="toggleDarkMode()" id="darkButton">
        🌙
    </button>
</div>
    <div class="chat-container">

        <div id="chat">
            <div class="message ai">
                <div class="bubble">
                    Halo! 👋 Aku Jo. Ada yang bisa aku bantu?
                </div>
            </div>
        </div>

        <div class="input-area">

    <input
        type="file"
        id="pdfFile"
        accept=".pdf,.png,.jpg,.jpeg"
    >

    <input
        id="message"
        type="text"
        placeholder="Tulis pesan..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">Kirim</button>

</div>
    </div>

<script>

async function sendMessage() {

    const input = document.getElementById("message");
    const chat = document.getElementById("chat");
    const fileInput = document.getElementById("pdfFile");

    const message = input.value.trim();

    if (!message && (!fileInput || fileInput.files.length === 0)) {
        return;
    }

    if (message) {
        chat.innerHTML += `
            <div class="message user">
                <div class="bubble">${message}</div>
            </div>
        `;
    }

    input.value = "";

    chat.innerHTML += `
        <div class="message ai" id="typing">
            <div class="bubble typing">Jo sedang mengetik...</div>
        </div>
    `;

    chat.scrollTop = chat.scrollHeight;

    try {

        const formData = new FormData();

formData.append("message", message);

if (fileInput && fileInput.files.length > 0) {
    formData.append("pdfFile", fileInput.files[0]);
}

const response = await fetch("/chat", {
    method: "POST",
    body: formData
});

const data = await response.json();
        document.getElementById("typing").remove();

        chat.innerHTML += `
            <div class="message ai">
                <div class="bubble">${formatAnswer(data.reply)}</div>
            </div>
        `;

        chat.scrollTop = chat.scrollHeight;

        if (fileInput) {
            fileInput.value = "";
        }

    } catch (error) {

        const typing = document.getElementById("typing");

        if (typing) {
            typing.remove();
        }

        chat.innerHTML += `
            <div class="message ai">
                <div class="bubble">
                    ❌ Terjadi kesalahan saat menghubungkan ke Jo.
                </div>
            </div>
        `;
    }
}
function toggleDarkMode() {
    document.body.classList.toggle("dark-mode");

    const button = document.getElementById("darkButton");

    if (document.body.classList.contains("dark-mode")) {
        button.innerHTML = "☀️";
    } else {
        button.innerHTML = "🌙";
    }
}
async function clearChat() {
    await fetch("/clear", {
        method: "POST"
    });

    const chat = document.getElementById("chat");

    chat.innerHTML = `
        <div class="message ai">
            <div class="bubble">
                Halo! 👋 Aku Jo. Ada yang bisa aku bantu?
            </div>
        </div>
    `;
}
function formatAnswer(text) {
    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\n/g, "<br>");
}
</script>

</body>
</html>
